<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Management System with Billing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Stock Management System</h1>
    <form id="stock-form">
        <input type="text" id="item-name" placeholder="Item Name" required>
        <input type="number" id="quantity" placeholder="Quantity" min="1" required>
        <input type="number" id="price" placeholder="Price" min="0" step="0.01" required>
        <button type="submit">Add Stock</button>
    </form>
    <input type="text" id="search" placeholder="Search by item name">
    <table>
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="stock-list">
        </tbody>
    </table>

    <h2>Billing</h2>
    <form id="billing-form">
        <select id="billing-item">
            <option value="">Select Item</option>
        </select>
        <input type="number" id="billing-qty" placeholder="Quantity" min="1">
        <button type="submit">Add to Bill</button>
    </form>
    <table id="bill-table">
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Unit Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody id="bill-list"></tbody>
        <tfoot>
            <tr>
                <td colspan="3" style="text-align:right;"><strong>Total:</strong></td>
                <td id="bill-total">0</td>
            </tr>
        </tfoot>
    </table>
</div>
<script src="script.js"></script>
</body>
</html>
